<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Shadowing</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="panel" id="panel">
      <header class="panel-header">
        <h1 class="panel-title" id="app-title" data-i18n="extName">English Shadowing</h1>
      </header>

      <div class="tabs" role="tablist" aria-labelledby="app-title" id="tablist">
        <button
          class="tab"
          id="tab-practise"
          role="tab"
          type="button"
          aria-controls="panel-practise"
          aria-selected="true"
          tabindex="0"
          data-tab="practise"
          data-i18n="tabPractise"
        >
          Practise
        </button>
        <button
          class="tab"
          id="tab-saved"
          role="tab"
          type="button"
          aria-controls="panel-saved"
          aria-selected="false"
          tabindex="-1"
          data-tab="saved"
          data-i18n="tabSaved"
        >
          Saved
        </button>
        <button
          class="tab"
          id="tab-settings"
          role="tab"
          type="button"
          aria-controls="panel-settings"
          aria-selected="false"
          tabindex="-1"
          data-tab="settings"
          data-i18n="tabSettings"
        >
          Settings
        </button>
      </div>

      <main class="panel-body">
        <section
          class="tab-panel"
          id="panel-practise"
          role="tabpanel"
          aria-labelledby="tab-practise"
          tabindex="0"
        ></section>

        <section
          class="tab-panel"
          id="panel-saved"
          role="tabpanel"
          aria-labelledby="tab-saved"
          tabindex="0"
          hidden
        ></section>

        <section
          class="tab-panel"
          id="panel-settings"
          role="tabpanel"
          aria-labelledby="tab-settings"
          tabindex="0"
          hidden
        ></section>
      </main>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
