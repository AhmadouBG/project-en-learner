[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "english-shadowing-backend"
version = "2.0.0"
description = "Local-first FastAPI backend for the English Shadowing Chrome extension"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",

    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # Async SQLite (cache + clip index)
    "aiosqlite>=0.20.0",

    # Structured logging
    "structlog>=24.1.0",

    # HTTP client (used by optional Ollama integration)
    "httpx>=0.27.0",

    # Audio decoding (Phase 4 — listed here so install is one-shot)
    # "av>=12.0.0",  # PyAV with bundled ffmpeg — uncomment in Phase 4

    # Text services (Phase 2)
    "nltk>=3.8.1",
    "requests>=2.31.0",

    # Existing dependencies kept for backward compat
    "google-genai>=0.1.0",
    "eng-to-ipa==0.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
ml = [
    # Phase 3 — TTS
    # "kokoro-onnx>=0.4.0",
    # Phase 4 — ASR + phoneme
    # "faster-whisper>=1.0.0",
    # "onnxruntime>=1.18.0",
    # Phase 5 — Prosody
    # "praat-parselmouth>=0.4.3",
    # "librosa>=0.10.2",
]

[project.scripts]
english-shadow = "backend.app.main:cli_serve"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A"]
ignore = ["ANN101", "ANN102", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
